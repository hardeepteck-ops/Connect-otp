
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Login</title>
  <style>
    body {
      font-family: Arial;
      background: #101827;
      color: white;
      text-align: center;
      padding: 25px;
    }
    input, button {
      width: 90%;
      padding: 14px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #1877f2;
      color: white;
      cursor: pointer;
    }
    .google {
      background: white;
      color: #222;
    }
  </style>
</head>
<body>

  <h1>Connect</h1>
  <h3>Welcome Back!</h3>

  <button class="google" onclick="googleLogin()">
    Continue with Google
  </button>

  <hr>

  <h3>Email Login / Signup</h3>

  <input id="email" type="email" placeholder="Enter Email">

  <input id="password" type="password"
  placeholder="Enter Password">

  <button onclick="emailSignup()">Create Account</button>

  <button onclick="emailLogin()">Login</button>

  <p id="status">Welcome to Connect</p>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script const SUPABASE_URL = "https://xiffckozfygnyqlgjoiq.supabase.co";

const SUPABASE_KEY = "sb_publishable_Hi1hzrTbleJaDEWeQi1UvA_Y6yp8Co-";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);>
    const firebaseConfig = {
      apiKey: "AIzaSyCdfQQyV9WtwK6IN_LlThRO1NYE37UnTog",
      authDomain: "connect-49bfd.firebaseapp.com",
      projectId: "connect-49bfd",
      storageBucket: "connect-49bfd.firebasestorage.app",
      messagingSenderId: "288101111081",
      appId: "1:288101111081:web:7c468f06fc45843e9d5338"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const status = document.getElementById("status");

    async function googleLogin() {
  status.innerText = "Google Login हो रहा है...";

  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://hardeepteck-ops.github.io/Connect-otp/"
    }
  });

  if (error) {
    status.innerText = error.message;
  }
    }

    async function emailSignup() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    status.innerText = "Enter Email and Password";
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if (error) {
    status.innerText = error.message;
    return;
  }

  if (data.session) {
    status.innerText = "Account Created Successfully!";

    if (window.AppInventor) {
      window.AppInventor.setWebViewString(
        "LOGIN_SUCCESS:" + data.user.id
      );
    }
  } else {
    status.innerText = "Account Created! Please check your email to verify.";
  }
    }

    async function emailLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    status.innerText = "Enter Email and Password";
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    status.innerText = error.message;
    return;
  }

  status.innerText = "Login Successful!";

  if (window.AppInventor) {
    window.AppInventor.setWebViewString(
      "LOGIN_SUCCESS:" + data.user.id
    );
  }
    }
        .catch(error => {
          status.innerText = error.message;
        });
    }
  </script>

</body>
</html>
