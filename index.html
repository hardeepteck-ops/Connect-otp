<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect OTP</title>
  <style>
    body {
      font-family: Arial;
      background: #101827;
      color: white;
      text-align: center;
      padding: 25px;
    }
    input, button {
      width: 90%;
      padding: 14px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background: #1877f2;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Connect</h2>
  <h3>Mobile OTP Login</h3>

  <input id="phone" placeholder="+91 Mobile Number">
  <button onclick="sendOTP()">Send OTP</button>

  <div id="recaptcha-container"></div>

  <input id="otp" placeholder="Enter OTP">
  <button onclick="verifyOTP()">Verify OTP</button>

  <p id="status">Enter your mobile number</p>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCdfQQyV9WtwK6IN_LlThRO1NYE37UnTog",
  authDomain: "connect-49bfd.firebaseapp.com",
  projectId: "connect-49bfd",
  storageBucket: "connect-49bfd.firebasestorage.app",
  messagingSenderId: "288101111081",
  appId: "1:288101111081:web:7c468f06fc45843e9d5338"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let confirmationResult;
let recaptchaWidgetId;

window.onload = async function () {
  window.recaptchaVerifier =
    new firebase.auth.RecaptchaVerifier(
      'recaptcha-container',
      { size: 'normal' }
    );

  recaptchaWidgetId = await recaptchaVerifier.render();
};

function sendOTP() {
  const phone = document.getElementById("phone").value.trim();
  const status = document.getElementById("status");

  if (!/^\+91[6-9]\d{9}$/.test(phone)) {
    status.innerText = "Enter valid number with +91";
    return;
  }

  status.innerText = "Sending OTP...";

  auth.signInWithPhoneNumber(phone, recaptchaVerifier)
    .then(result => {
      confirmationResult = result;
      status.innerText = "OTP sent successfully!";
    })
    .catch(error => {
      status.innerText = error.message;

      if (recaptchaWidgetId !== undefined) {
        grecaptcha.reset(recaptchaWidgetId);
      }
    });
}

function verifyOTP() {
  const otp = document.getElementById("otp").value.trim();
  const status = document.getElementById("status");

  if (!confirmationResult) {
    status.innerText = "Please send OTP first";
    return;
  }

  confirmationResult.confirm(otp)
    .then(result => {
      status.innerText = "Login successful!";

      if (window.AppInventor) {
        window.AppInventor.setWebViewString(
          "OTP_VERIFIED:" + result.user.uid
        );
      }
    })
    .catch(error => {
      status.innerText = error.message;
    });
}
</script>
</body>
</html>
