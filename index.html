er;gap:12px;padding:12px;border-bottom:1px solid #eee}.userrow button{margin-left:auto}.profiletop{text-align:center;padding:20px 10px}.profileavatar{width:105px;height:105px;border-radius:50%;object-fit:cover;border:2px solid #eee}.profilecounts{display:flex;justify-content:space-around;margin:18px 0}.profilecounts span{text-align:center;cursor:pointer}.profilecounts span:active{opacity:.65}.profilecounts b{display:block;font-size:20px}.profilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:15px}.gridpost img,.gridpost video{width:100%;aspect-ratio:1;object-fit:cover}.empty{text-align:center;padding:35px;color:#888}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.modalcard{background:#fff;border-radius:15px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead button{border:0;background:none;font-size:24px}.preview{width:90px;height:90px;object-fit:cover;border-radius:50%;display:block;margin:8px auto}.storyview{background:#111;color:white;width:100%;max-width:430px;height:80vh;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;position:relative}.storytop{padding:12px;display:flex;justify-content:space-between;position:absolute;z-index:2;width:100%}.storytop button{background:#222;color:#fff;border:0;border-radius:50%;padding:8px}.storymedia{height:100%;display:flex;align-items:center;justify-content:center}.storymedia img,.storymedia video{max-width:100%;max-height:100%;object-fit:contain}.filehint{font-size:12px;color:#777}.notice{padding:12px;border-bottom:1px solid #eee}.caption p{margin:7px 0}.linkbtn{border:0;background:none;color:var(--blue);padding:5px}

<script>
const SUPABASE_URL="https://xiffckozfygnyqlgjoiq.supabase.co";
const SUPABASE_KEY="sb_publishable_Hi1hzrTbleJaDEWeQi1UvA_Y6yp8Co-";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);
let currentUser=null,currentProfile=null,activePage="home",feedBusy=false,feedCache=null,profileRequest=0;
const placeholder="https://placehold.co/100";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function msg(t){$("authMsg").innerText=t;}
function showSignup(){$("loginBox").classList.add("hidden");$("signupBox").classList.remove("hidden");}
function showLogin(){$("signupBox").classList.add("hidden");$("loginBox").classList.remove("hidden");}
$("toSignup").onclick=showSignup;$("toLogin").onclick=showLogin;
$("loginBtn").onclick=login;$("signupBtn").onclick=signup;$("logoutBtn").onclick=logout;
document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>go(b.dataset.page));
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.add("hidden"));
$("closeStory").onclick=()=>$("storyModal").classList.add("hidden");
 
const SUPABASE_URL = "https://xiffckozfygnyqlgjoiq.supabase.co";
const SUPABASE_KEY = "sb_publishable_Hi1hzrTbleJaDEWeQi1UvA_Y6yp8Co-";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;

const $ = (id) => document.getElementById(id);

// AUTH: SIGN UP
async function signUp() {
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;
  const fullName = $("signupName").value.trim();
  const username = $("signupUsername").value.trim();

  if (!email || !password || !fullName || !username) {
    alert("Please fill all fields");
    return;
  }

  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: {
      data: {
        full_name: fullName,
        username: username
      }
    }
  });

  if (error) {
    alert(error.message);
    return;
  }

  alert("Account created successfully. Please verify your email.");
}

// AUTH: LOGIN
async function login() {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  currentUser = data.user;
  await initializeApp();
}

// LOGOUT
async function logout() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  currentProfile = null;
  location.reload();
}

// APP INITIALIZATION
async function initializeApp() {
  const { data } = await supabaseClient.auth.getUser();

  currentUser = data.user;

  if (!currentUser) return;

  await loadProfile();
  showMainApp();
  await loadFeed();
}

// PROFILE
async function loadProfile() {
  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error(error);
    return;
  }

  currentProfile = data;
}

// NAVIGATION
function showSection(sectionId) {
  document.querySelectorAll(".app-section").forEach(section => {
    section.style.display = "none";
  });

  const section = $(sectionId);

  if (section) {
    section.style.display = "block";
  }

  document.querySelectorAll(".nav-item").forEach(item => {
    item.classList.remove("active");
  });
}

// FILE UPLOAD
async function uploadFile(file) {
  if (!file) return null;

  const extension = file.name.split(".").pop();
  const fileName =
    currentUser.id + "/" + Date.now() + "." + extension;

  const { data, error } = await supabaseClient.storage
    .from("connect-media")
    .upload(fileName, file, {
      cacheControl: "3600",
      upsert: false
    });

  if (error) {
    throw error;
  }

  const { data: publicData } = supabaseClient.storage
    .from("connect-media")
    .getPublicUrl(data.path);

  return publicData.publicUrl;
}

// CREATE POST
async function uploadPost() {
  const button = $("sharePostBtn");
  button.disabled = true;

  try {
    const caption = $("postCaption").value.trim();
    const file = $("postFile").files[0];

    if (!caption && !file) {
      alert("Write something or select media");
      return;
    }

    if (file && file.size > 100 * 1024 * 1024) {
      alert("Maximum file size is 100 MB");
      return;
    }

    let mediaUrl = null;
    let mediaType = null;

    if (file) {
      mediaUrl = await uploadFile(file);
      mediaType = file.type.startsWith("video/")
        ? "video"
        : "image";
    }

    const { error } = await supabaseClient
      .from("posts")
      .insert({
        user_id: currentUser.id,
        caption: caption,
        media_url: mediaUrl,
        media_type: mediaType
      });

    if (error) throw error;

    $("postCaption").value = "";
    $("postFile").value = "";

    alert("Post shared successfully!");

    await loadFeed();

  } catch (error) {
    alert(error.message);
  } finally {
    $("sharePostBtn").disabled = false;
  }
 }
 
// LOAD HOME FEED
async function loadFeed() {
  const feed =
    $("feedContainer") ||
    $("homeFeed") ||
    $("postsContainer");

  if (!feed) {
    console.error("Feed container not found");
    return;
  }

  feed.innerHTML = "<p>Loading posts...</p>";

  const { data: posts, error } = await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    feed.innerHTML = "Unable to load posts";
    console.error(error);
    return;
  }

  if (!posts || posts.length === 0) {
    feed.innerHTML = "<p>No posts yet. Be the first to share!</p>";
    return;
  }

  const userIds = [...new Set(posts.map(p => p.user_id))];

  const { data: profiles } = await supabaseClient
    .from("profiles")
    .select("*")
    .in("id", userIds);

  const profileMap = {};

  (profiles || []).forEach(p => {
    profileMap[p.id] = p;
  });

  const { data: likes } = await supabaseClient
    .from("likes")
    .select("post_id,user_id")
    .in("post_id", posts.map(p => p.id));

  const { data: comments } = await supabaseClient
    .from("comments")
    .select("post_id")
    .in("post_id", posts.map(p => p.id));

  feed.innerHTML = posts.map(post => {
    const profile = profileMap[post.user_id] || {};
    const liked = (likes || []).some(
      l => l.post_id === post.id &&
           l.user_id === currentUser.id
    );

    const likeCount = (likes || []).filter(
      l => l.post_id === post.id
    ).length;

    const commentCount = (comments || []).filter(
      c => c.post_id === post.id
    ).length;

    const name = escapeHTML(
      profile.full_name || profile.username || "Connect User"
    );

    const username = escapeHTML(profile.username || "user");

    const caption = escapeHTML(post.caption || "");

    let media = "";

    if (post.media_url) {
      media = post.media_type === "video"
        ? `<video src="${escapeHTML(post.media_url)}"
             controls playsinline style="width:100%"></video>`
        : `<img src="${escapeHTML(post.media_url)}"
             style="width:100%;display:block">`;
    }

    return `
      <article class="connect-post" style="
        background:white;
        border:1px solid #eee;
        border-radius:12px;
        margin:12px 0;
        padding:12px;
      ">
        <div style="font-weight:bold;margin-bottom:10px">
          ${name}
          <small style="color:gray">@${username}</small>
        </div>

        ${media}

        <p>${caption}</p>

        <div style="display:flex;gap:18px;flex-wrap:wrap">
          <button onclick="toggleLike('${post.id}')">
            ${liked ? "❤️" : "🤍"} ${likeCount}
          </button>

          <button onclick="showComments('${post.id}')">
            💬 ${commentCount}
          </button>

          ${
            post.user_id !== currentUser.id
            ? `<button onclick="toggleFollow('${post.user_id}')">
                Follow
              </button>`
            : ""
          }
        </div>
      </article>
    `;
  }).join("");
}

// SAFE HTML
function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

// LIKE / UNLIKE
async function toggleLike(postId) {
  if (!currentUser) return;

  const { data: existing, error: findError } =
    await supabaseClient
      .from("likes")
      .select("id")
      .eq("post_id", postId)
      .eq("user_id", currentUser.id)
      .maybeSingle();

  if (findError) {
    alert(findError.message);
    return;
  }

  if (existing) {
    const { error } = await supabaseClient
      .from("likes")
      .delete()
      .eq("id", existing.id);

    if (error) {
      alert(error.message);
      return;
    }
  } else {
    const { error } = await supabaseClient
      .from("likes")
      .insert({
        post_id: postId,
        user_id: currentUser.id
      });

    if (error) {
      alert(error.message);
      return;
    }
  }

  await loadFeed();
}

// SHOW COMMENTS
async function showComments(postId) {
  const { data, error } = await supabaseClient
    .from("comments")
    .select("*")
    .eq("post_id", postId)
    .order("created_at", { ascending: true });

  if (error) {
    alert(error.message);
    return;
  }

  const commentText = (data || [])
    .map(c => c.content)
    .join("\n");

  const newComment = prompt(
    "Comments:\n" + (commentText || "No comments yet") +
    "\n\nWrite your comment:"
  );

  if (newComment === null || !newComment.trim()) return;

  const { error: insertError } = await supabaseClient
    .from("comments")
    .insert({
      post_id: postId,
      user_id: currentUser.id,
      content: newComment.trim()
    });

  if (insertError) {
    alert(insertError.message);
    return;
  }

  await loadFeed();
}

// FOLLOW / UNFOLLOW
async function toggleFollow(userId) {
  if (!currentUser || userId === currentUser.id) return;

  const { data: existing, error: findError } =
    await supabaseClient
      .from("follows")
      .select("id")
      .eq("follower_id", currentUser.id)
      .eq("following_id", userId)
      .maybeSingle();

  if (findError) {
    alert(findError.message);
    return;
  }

  if (existing) {
    const { error } = await supabaseClient
      .from("follows")
      .delete()
      .eq("id", existing.id);

    if (error) {
      alert(error.message);
      return;
    }
  } else {
    const { error } = await supabaseClient
      .from("follows")
      .insert({
        follower_id: currentUser.id,
        following_id: userId
      });

    if (error) {
      alert(error.message);
      return;
    }
  }

  await loadFeed();
 }

// ================================
// USER SEARCH
// ================================

async function searchUsers() {
  const searchInput = $("searchInput");
  const results = $("searchResults");

  if (!searchInput || !results) return;

  const query = searchInput.value.trim();

  if (!query) {
    results.innerHTML = "";
    return;
  }

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .ilike("username", `%${query}%`)
    .limit(20);

  if (error) {
    results.textContent = error.message;
    return;
  }

  results.innerHTML = (data || [])
    .filter(user => user.id !== currentUser.id)
    .map(user => `
      <div class="search-user" style="padding:12px;border-bottom:1px solid #eee">
        <strong>${escapeHTML(user.full_name || user.username || "User")}</strong>
        <p>@${escapeHTML(user.username || "")}</p>
        <button onclick="viewProfile('${user.id}')">
          View Profile
        </button>
        <button onclick="toggleFollow('${user.id}')">
          Follow
        </button>
      </div>
    `).join("");
}

// ================================
// VIEW PROFILE
// ================================

async function viewProfile(userId) {
  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", userId)
    .maybeSingle();

  if (error || !profile) {
    alert("Profile not found");
    return;
  }

  const { count: followers } = await supabaseClient
    .from("follows")
    .select("*", { count: "exact", head: true })
    .eq("following_id", userId);

  const { count: following } = await supabaseClient
    .from("follows")
    .select("*", { count: "exact", head: true })
    .eq("follower_id", userId);

  const { data: posts } = await supabaseClient
    .from("posts")
    .select("*")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  const profileBox = $("profileContainer");

  if (!profileBox) return;

  profileBox.innerHTML = `
    <div style="padding:15px;background:white;border-radius:12px">
      <h2>${escapeHTML(profile.full_name || "User")}</h2>
      <p>@${escapeHTML(profile.username || "")}</p>
      <p>${escapeHTML(profile.bio || "")}</p>

      <div style="display:flex;gap:25px">
        <span><b>${(posts || []).length}</b> Posts</span>
        <span><b>${followers || 0}</b> Followers</span>
        <span><b>${following || 0}</b> Following</span>
      </div>

      ${
        userId === currentUser.id
        ? `<button onclick="editProfile()">Edit Profile</button>`
        : `<button onclick="toggleFollow('${userId}')">Follow / Unfollow</button>`
      }
    </div>

    <div class="profile-posts">
      ${(posts || []).map(post => `
        <div style="margin-top:12px;padding:10px;border:1px solid #eee">
          ${
            post.media_url
            ? post.media_type === "video"
              ? `<video src="${escapeHTML(post.media_url)}" controls playsinline style="width:100%"></video>`
              : `<img src="${escapeHTML(post.media_url)}" style="width:100%">`
            : ""
          }
          <p>${escapeHTML(post.caption || "")}</p>
        </div>
      `).join("")}
    </div>
  `;

  showSection("profileSection");
}

// ================================
// MY PROFILE
// ================================

async function openMyProfile() {
  if (!currentUser) return;
  await viewProfile(currentUser.id);
}

// ================================
// EDIT PROFILE
// ================================

async function editProfile() {
  if (!currentUser) return;

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error || !profile) {
    alert("Profile not found");
    return;
  }

  const fullName = prompt(
    "Enter your name:",
    profile.full_name || ""
  );

  if (fullName === null) return;

  const username = prompt(
    "Enter username:",
    profile.username || ""
  );

  if (username === null) return;

  const bio = prompt(
    "Enter your bio:",
    profile.bio || ""
  );

  if (bio === null) return;

  const { error: updateError } = await supabaseClient
    .from("profiles")
    .update({
      full_name: fullName.trim(),
      username: username.trim().replace(/^@/, ""),
      bio: bio.trim()
    })
    .eq("id", currentUser.id);

  if (updateError) {
    alert(updateError.message);
    return;
  }

  alert("Profile updated successfully!");

  await loadProfile();
  await openMyProfile();
}

// ================================
// REELS
// ================================

async function loadReels() {
  const reelsBox = $("reelsContainer");

  if (!reelsBox) return;

  reelsBox.innerHTML = "<p>Loading reels...</p>";

  const { data, error } = await supabaseClient
    .from("posts")
    .select("*")
    .eq("media_type", "video")
    .order("created_at", { ascending: false });

  if (error) {
    reelsBox.textContent = error.message;
    return;
  }

  if (!data || data.length === 0) {
    reelsBox.innerHTML = "<p>No reels available yet.</p>";
    return;
  }

  reelsBox.innerHTML = data.map(reel => `
    <div style="
      background:#111;
      margin:12px auto;
      max-width:420px;
      border-radius:12px;
      overflow:hidden;
      color:white;
    ">
      <video
        src="${escapeHTML(reel.media_url)}"
        controls
        playsinline
        loop
        style="width:100%;max-height:650px"
      ></video>

      <div style="padding:12px">
        <p>${escapeHTML(reel.caption || "")}</p>
        <button onclick="toggleLike('${reel.id}')">
          ❤️ Like
        </button>
        <button onclick="showComments('${reel.id}')">
          💬 Comment
        </button>
      </div>
    </div>
  `).join("");
}

// SHOW MAIN APP
function showMainApp() {
  const loginSection = $("loginSection");
  const signupSection = $("signupSection");
  const mainApp = $("mainApp");

  if (loginSection) loginSection.style.display = "none";
  if (signupSection) signupSection.style.display = "none";
  if (mainApp) mainApp.style.display = "block";

  showSection("homeSection");
}

// SHOW LOGIN
function showLogin() {
  const loginSection = $("loginSection");
  const signupSection = $("signupSection");
  const mainApp = $("mainApp");

  if (loginSection) loginSection.style.display = "block";
  if (signupSection) signupSection.style.display = "none";
  if (mainApp) mainApp.style.display = "none";
}

// SHOW SIGNUP
function showSignup() {
  const loginSection = $("loginSection");
  const signupSection = $("signupSection");

  if (loginSection) loginSection.style.display = "none";
  if (signupSection) signupSection.style.display = "block";
}

}

}

async function openProfile() {

async function openCreatePost() {

// REFRESH APP SESSION
async function checkSession() {
  const { data, error } = await supabaseClient.auth.getSession();

  if (error) {
    console.error(error);
    showLogin();
    return;
  }

  if (data.session) {
    currentUser = data.session.user;
    await initializeApp();
  } else {
    showLogin();
  }
}

// AUTH STATE LISTENER
supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
    currentProfile = null;
    showLogin();
  }
});

// INITIAL START
document.addEventListener("DOMContentLoaded", async () => {
  await checkSession();
});
