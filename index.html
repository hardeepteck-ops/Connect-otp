
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Login</title>
  <style>
    body {
      font-family: Arial;
      background: #101827;
      color: white;
      text-align: center;
      padding: 25px;
    }
    input, button {
      width: 90%;
      padding: 14px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      background: #1877f2;
      color: white;
      cursor: pointer;
    }
    .google {
      background: white;
      color: #222;
    }
  </style>
</head>
<body>

  <h1>Connect</h1>
  <h3>Welcome Back!</h3>

  <button class="google" onclick="googleLogin()">
    Continue with Google
  </button>

  <hr>

  <h3>Email Login / Signup</h3>

  <input id="email" type="email" placeholder="Enter Email">

  <input id="password" type="password"
  placeholder="Enter Password">

  <button onclick="emailSignup()">Create Account</button>

  <button onclick="emailLogin()">Login</button>

  <p id="status">Welcome to Connect</p>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCdfQQyV9WtwK6IN_LlThRO1NYE37UnTog",
      authDomain: "connect-49bfd.firebaseapp.com",
      projectId: "connect-49bfd",
      storageBucket: "connect-49bfd.firebasestorage.app",
      messagingSenderId: "288101111081",
      appId: "1:288101111081:web:7c468f06fc45843e9d5338"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const status = document.getElementById("status");

    function googleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();

      auth.signInWithPopup(provider)
        .then(result => {
          status.innerText = "Google Login Successful!";

          if (window.AppInventor) {
            window.AppInventor.setWebViewString(
              "LOGIN_SUCCESS:" + result.user.uid
            );
          }
        })
        .catch(error => {
          status.innerText = error.message;
        });
    }

    function emailSignup() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        status.innerText = "Enter Email and Password";
        return;
      }

      auth.createUserWithEmailAndPassword(email, password)
        .then(result => {
          status.innerText = "Account Created Successfully!";

          if (window.AppInventor) {
            window.AppInventor.setWebViewString(
              "LOGIN_SUCCESS:" + result.user.uid
            );
          }
        })
        .catch(error => {
          status.innerText = error.message;
        });
    }

    function emailLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        status.innerText = "Enter Email and Password";
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then(result => {
          status.innerText = "Login Successful!";

          if (window.AppInventor) {
            window.AppInventor.setWebViewString(
              "LOGIN_SUCCESS:" + result.user.uid
            );
          }
        })
        .catch(error => {
          status.innerText = error.message;
        });
    }
  </script>

</body>
</html>
